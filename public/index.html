<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Eye Capture System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<body>
  <div id="app">
    <!-- ────────── 上段：エージェント＋左右ボタン ────────── -->
    <section id="top">
      <div id="topGrid">
        <div class="side left">
          <button id="btnStart" class="circle-btn large">Start</button>
        </div>
        <div class="center">
          <canvas id="myCanvas1"></canvas>
        </div>
        <div class="side right">
          <button id="btnStop" class="circle-btn large" disabled>Stop</button>
        </div>
      </div>
    </section>

    <!-- ────────── 仕切りトグル ────────── -->
    <div id="dividerToggle" role="button" tabindex="0" aria-expanded="true" aria-label="プレビュー領域の表示切替">
      <span class="grip" aria-hidden="true"></span>
    </div>

    <!-- ────────── 下段：プレビュー＋座標データ ────────── -->
    <section id="bottom">
      <div id="bottomGrid">
        <!-- 左：カメラ映像＋ランドマーク -->
        <div id="mpPreviewWrap">
          <video id="mpPreview" autoplay playsinline muted></video>
          <canvas id="mpOverlay"></canvas>
        </div>

        <!-- 右：取得座標データ -->
        <aside id="dataPanel" aria-label="MediaPipe 取得座標">
          <header>
            <h3>取得座標</h3>
            <small id="frameInfo">—</small>
            <small id="openInfo" style="margin-left:8px;color:#9fe29f;">Open: —%</small>
          </header>
          <pre id="coordLog" class="log"></pre>
        </aside>
      </div>
    </section>
  </div>

  <!-- ────────── アプリ用スクリプト ────────── -->
  <script type="module" src="scripts/config.js"></script>
  <script type="module" src="scripts/agent.js"></script>
  <script type="module" src="scripts/mediapipe.js"></script>
  <script type="module" src="scripts/calibration.js"></script>
  <script type="module" src="scripts/main.js"></script>
</body>
</html>
